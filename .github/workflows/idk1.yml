name: CoAIberry Worker

on:
  repository_dispatch:
    types: [launch_worker_p1]

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx pydantic
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Setup Kaggle Directory
        run: |
          sudo mkdir -p /kaggle/working
          sudo chmod -R 777 /kaggle

      - name: Execute Memory Script
        env:
          USER_PROMPT: ${{ github.event.client_payload.prompt }}
          TARGET_USER: ${{ github.event.client_payload.username }}
          CONTACT_PORT: ${{ github.event.client_payload.contact }}
          SECRET_DOWNLOAD_TOKEN: ${{ secrets.WORKER_GIT_TOKEN }}
          SECRET_FILE_URL: ${{ secrets.SECRET_CORE_SCRIPT_URL }}
        run: |
          # Signal handler to immediately kill child process tree on cancellation
          trap 'echo "Cancellation signal received. Killing process tree..."; pkill -9 -P $$ || true; exit 1' SIGINT SIGTERM
          
          curl -s -H "Authorization: token $SECRET_DOWNLOAD_TOKEN" -L "$SECRET_FILE_URL" | python -u - &
          
          # Wait for backgrounded pipe and forward termination signals properly
          PID=$!
          wait $PID

      - name: Cleanup Workspace
        if: always()
        run: |
          pkill -9 -f python || true
          rm -rf ${{ github.workspace }}/*
          sudo rm -rf /kaggle/working/* || true
